[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# A URL real vem de app.core.config.Settings (variável de ambiente
# DATABASE_URL), definida dinamicamente em migrations/env.py. Este valor é
# apenas um placeholder para o caso de alguém rodar `alembic` sem o pacote
# da aplicação disponível.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
