# Ambiente de desenvolvimento/staging local integrado — criado na Fase 0,
# estendido na Fase 8 (worker RQ real).
#
# Fica na raiz do repositório (não em infra/) de propósito, para que
# `docker compose up` funcione diretamente a partir daqui, sem flag `-f`.
# Ver infra/README.md para a justificativa completa dessa escolha.
#
# IMPORTANTE: este arquivo AINDA não foi executado em nenhuma sessão deste
# projeto (Fases 0-8) porque nenhuma máquina usada até aqui tem Docker
# instalado — confirmado repetidamente, mais recentemente na auditoria
# F8.0. A sintaxe foi validada estruturalmente (parse YAML sem erro) e cada
# variável/comando foi revisado manualmente, mas `docker compose up` ainda
# precisa ser validado por alguém com Docker disponível antes deste
# critério ser considerado fechado. Ver docs/production-readiness.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospect}
      POSTGRES_DB: ${POSTGRES_DB:-prospect_ai}
    ports:
      - "5432:5432"
    volumes:
      - prospect_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospect}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prospect}:${POSTGRES_PASSWORD:-prospect}@postgres:5432/${POSTGRES_DB:-prospect_ai}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  worker:
    # Fase 8.2 — antes desta fase não existia NENHUM processo consumindo as
    # filas Redis (discovery/audit/briefing); um job "enfileirado" ficava
    # parado para sempre, mesmo com Redis disponível (achado da auditoria
    # F8.0, seção 10). Reaproveita a MESMA imagem do backend — é o mesmo
    # código, só um entrypoint diferente (`python -m app.worker`), não um
    # serviço/deploy separado. Sem HEALTHCHECK próprio: RQ não expõe um
    # endpoint HTTP para checar, e inventar um mecanismo frágil só para ter
    # "um healthcheck" seria pior que não ter nenhum — a observabilidade
    # real de um worker travado vem de métricas de fila (F8.6), não de um
    # healthcheck de container.
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prospect}:${POSTGRES_PASSWORD:-prospect}@postgres:5432/${POSTGRES_DB:-prospect_ai}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    # Fase 8.4 — antes desta fase o frontend não tinha nenhuma forma
    # containerizada de rodar; só `npm run dev` local. `API_BASE_URL`
    # aponta para o nome do serviço `backend` (resolução de DNS interna do
    # Compose), não `localhost` — dentro da rede do Compose, cada serviço
    # é acessível pelo nome do serviço.
    build:
      context: ./frontend
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  prospect_ai_postgres_data:
